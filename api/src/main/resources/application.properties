spring.application.name=institutomaoamiga

# Configuracao do banco H2 em memoria
spring.datasource.url=jdbc:h2:mem:institutomaoamiga
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate e carga inicial via data.sql
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Paginacao: padrao 20, maximo 50, formato DTO { "content": [...], "page": {...} }
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.serialization-mode=via-dto
