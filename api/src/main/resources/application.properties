spring.application.name=institutomaoamiga

# Configuracao do banco H2 gravando em arquivo local
spring.datasource.url=jdbc:h2:file:./data/institutomaoamiga;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Paginacao: padrao 10, maximo 50, formato DTO { "content": [...], "page": {...} }
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.serialization-mode=via_dto
